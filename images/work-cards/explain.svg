<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Explain exploration card</title><desc id="description">A Mattermost command for shared technical understanding.</desc>
  <rect width="1200" height="720" fill="#101010"/><rect x="44" y="44" width="1112" height="632" rx="12" fill="#1a1a1a" stroke="#3d3a39" stroke-width="2"/>
  <text x="92" y="126" fill="#00d992" font-family="monospace" font-size="24" letter-spacing="4">INTERNAL TOOL · SHARED UNDERSTANDING</text>
  <text x="92" y="232" fill="#f2f2f2" font-family="Arial, sans-serif" font-size="78">/explain</text>
  <text x="92" y="290" fill="#bdbdbd" font-family="Arial, sans-serif" font-size="31">A small command for making complex ideas click</text>
  <rect x="92" y="370" width="1016" height="82" rx="7" fill="#101010" stroke="#3d3a39" stroke-width="2"/>
  <text x="124" y="422" fill="#f2f2f2" font-family="monospace" font-size="26">/explain [technical concept]</text>
  <g font-family="monospace" font-size="22"><text x="92" y="538" fill="#00d992">JUST ENOUGH</text><text x="92" y="578" fill="#bdbdbd">Context, not a rabbit hole</text><text x="570" y="538" fill="#00d992">SHARED LANGUAGE</text><text x="570" y="578" fill="#bdbdbd">Teams stay aligned</text></g>
</svg>
