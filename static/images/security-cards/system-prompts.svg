<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">System prompts learning note card</title><desc id="description">A visual card about model behaviour in different contexts.</desc>
  <rect width="1200" height="720" fill="#101010"/><rect x="44" y="44" width="1112" height="632" rx="12" fill="#1a1a1a" stroke="#3d3a39" stroke-width="2"/>
  <text x="92" y="126" fill="#00d992" font-family="monospace" font-size="24" letter-spacing="4">AI SECURITY · LEARNING JOURNAL</text>
  <text x="92" y="232" fill="#f2f2f2" font-family="Arial, sans-serif" font-size="65">Same Model, Different Answer</text>
  <text x="92" y="290" fill="#bdbdbd" font-family="Arial, sans-serif" font-size="31">How system context shapes a response</text>
  <rect x="92" y="370" width="1016" height="82" rx="7" fill="#101010" stroke="#3d3a39" stroke-width="2"/>
  <text x="124" y="422" fill="#f2f2f2" font-family="monospace" font-size="25">SAME MODEL  +  DIFFERENT SYSTEM CONTEXT</text>
  <g font-family="monospace" font-size="22"><text x="92" y="538" fill="#00d992">INTERFACE</text><text x="92" y="578" fill="#bdbdbd">Changes behaviour</text><text x="570" y="538" fill="#00d992">SYSTEM PROMPT</text><text x="570" y="578" fill="#bdbdbd">Sets the boundary</text></g>
</svg>
